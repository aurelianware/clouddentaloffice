name: Deploy to Azure Container Apps

# Runs on every push to main (alongside the existing deploy-doks.yml pipeline).
# Requires a one-time infrastructure setup — see infrastructure/azure/README below.
#
# Required GitHub repository secrets:
#   AZURE_CLIENT_ID        – App Registration / service principal client ID (used for OIDC login)
#   AZURE_TENANT_ID        – Azure AD tenant ID
#   AZURE_SUBSCRIPTION_ID  – Azure subscription ID
#   AZURE_RESOURCE_GROUP   – production resource group (`cdo-prod-rg`)
#   ACR_NAME               – Azure Container Registry name (e.g. cdoacr from Bicep output)
#   ACR_LOGIN_SERVER       – ACR login server (e.g. cdoacr.azurecr.io from Bicep output)
#   POSTGRES_HOST          – PostgreSQL Flexible Server FQDN
#   POSTGRES_ADMIN_PASSWORD – PostgreSQL administrator password
#   JWT_KEY                – Portal signing key
#   PUBLIC_BOOKING_API_KEY – 32+ character website-to-IntakeService credential
#   PATIENT_SERVICE_API_KEY – 32+ character SchedulingService-to-Portal (internal patient match-or-create) credential
#   GOOGLE_OAUTH_CLIENT_ID – Google OAuth web client for the Portal ACA hostname
#   GOOGLE_OAUTH_CLIENT_SECRET – matching Google OAuth client secret
#   CHO_ESTIMATE_API_KEY   – API key for the estimate-only CloudHealthOffice endpoint
#
# One-time infrastructure setup (run locally, not in CI):
#   az group create --name cdo-prod-rg --location westus3
#   az deployment group create \
#     --resource-group cdo-prod-rg \
#     --template-file infrastructure/azure/main.bicep \
#     --parameters @infrastructure/azure/parameters.bicepparam
#
# After the first Bicep deploy, note the outputs:
#   acrName, acrLoginServer → set as ACR_NAME / ACR_LOGIN_SERVER secrets
#   portalFqdn              → your app's public URL

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
  RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}

permissions:
  id-token: write   # Required for OIDC token exchange with Azure
  contents: read

# One production deploy at a time. Runs queue rather than collide on the ARM
# deployments named "main"/"apps", and a running deploy is never cancelled.
concurrency:
  group: deploy-aca-production
  cancel-in-progress: false

jobs:
  validate-manual:
    name: Validate manual deployment
    if: ${{ github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/ci.yml

  # workflow_run always executes the workflow file from the tip of main, but
  # checks out the commit whose CI finished. When PRs merge close together, an
  # older run would pair a newer workflow with older templates (e.g. passing a
  # parameter the older apps.bicep does not declare). Deploy only the commit
  # that is still the tip of main; the run for the newer commit deploys it.
  freshness:
    name: Check commit is still main
    runs-on: ubuntu-latest
    outputs:
      current: ${{ steps.check.outputs.current }}
    steps:
      - name: Compare with main
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "workflow_run" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          main_sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)
          if [ "$main_sha" = "$RUN_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping deploy of ${RUN_SHA:0:7}; main is now ${main_sha:0:7}, whose run deploys it."
          fi

  build-and-deploy:
    name: Build, Push & Deploy
    needs: [validate-manual, freshness]
    if: >-
      ${{ always() &&
          needs.freshness.outputs.current == 'true' &&
          ((github.event_name == 'workflow_run' &&
            github.event.workflow_run.event == 'push' &&
            github.event.workflow_run.conclusion == 'success') ||
           (github.event_name == 'workflow_dispatch' && needs.validate-manual.result == 'success')) }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # Authenticate to Azure using OIDC (no long-lived credentials stored)
      # Pre-requisite: configure federated credential on your App Registration:
      #   Subject: repo:<org>/<repo>:ref:refs/heads/main
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify production subscription
        run: |
          test "$(az account show --query id -o tsv)" = "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          test "${{ secrets.AZURE_SUBSCRIPTION_ID }}" = "85bd1f0d-3a84-4070-a1d1-9358fa42c10e"

      # Phase 1 — Deploy core infrastructure (ACR, Container App Environment, Managed Identity).
      # Does NOT create Container Apps — images must exist first.
      - name: Deploy infrastructure (Bicep)
        run: |
          az deployment group create \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --template-file infrastructure/azure/main.bicep \
            --mode Incremental

      # Capture infra outputs for use in later steps
      - name: Get infrastructure outputs
        id: infra
        run: |
          ENVIRONMENT_ID=$(az deployment group show \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --name main \
            --query properties.outputs.environmentId.value -o tsv)
          IDENTITY_ID=$(az deployment group show \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --name main \
            --query properties.outputs.identityId.value -o tsv)
          PORTAL_IDENTITY_ID=$(az deployment group show \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --name main \
            --query properties.outputs.portalIdentityId.value -o tsv)
          PORTAL_IDENTITY_CLIENT_ID=$(az deployment group show \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --name main \
            --query properties.outputs.portalIdentityClientId.value -o tsv)
          KEY_VAULT_URI=$(az deployment group show \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --name main \
            --query properties.outputs.keyVaultUri.value -o tsv)
          {
            echo "environment_id=$ENVIRONMENT_ID"
            echo "identity_id=$IDENTITY_ID"
            echo "portal_identity_id=$PORTAL_IDENTITY_ID"
            echo "portal_identity_client_id=$PORTAL_IDENTITY_CLIENT_ID"
            echo "key_vault_uri=$KEY_VAULT_URI"
          } >> "$GITHUB_OUTPUT"

      - name: Login to Azure Container Registry
        run: az acr login --name ${{ secrets.ACR_NAME }}

      # ── Build & push all service images ──────────────────────────────────────

      - name: Build and push portal
        run: |
          docker build -f infrastructure/docker/Portal.Dockerfile \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/portal:${{ env.IMAGE_TAG }} \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/portal:latest .
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/portal:${{ env.IMAGE_TAG }}
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/portal:latest

      - name: Build and push api-gateway
        run: |
          docker build -f infrastructure/docker/ApiGateway.Dockerfile \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/api-gateway:${{ env.IMAGE_TAG }} \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/api-gateway:latest .
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/api-gateway:${{ env.IMAGE_TAG }}
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/api-gateway:latest

      - name: Build and push scheduling-service
        run: |
          docker build -f infrastructure/docker/SchedulingService.Dockerfile \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/scheduling-service:${{ env.IMAGE_TAG }} \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/scheduling-service:latest .
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/scheduling-service:${{ env.IMAGE_TAG }}
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/scheduling-service:latest

      - name: Build and push intake-service
        run: |
          docker build -f infrastructure/docker/IntakeService.Dockerfile \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/intake-service:${{ env.IMAGE_TAG }} \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/intake-service:latest .
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/intake-service:${{ env.IMAGE_TAG }}
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/intake-service:latest

      - name: Build and push claims-service
        run: |
          docker build -f infrastructure/docker/ClaimsService.Dockerfile \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/claims-service:${{ env.IMAGE_TAG }} \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/claims-service:latest .
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/claims-service:${{ env.IMAGE_TAG }}
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/claims-service:latest

      - name: Build and push eligibility-service
        run: |
          docker build -f infrastructure/docker/EligibilityService.Dockerfile \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/eligibility-service:${{ env.IMAGE_TAG }} \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/eligibility-service:latest .
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/eligibility-service:${{ env.IMAGE_TAG }}
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/eligibility-service:latest

      - name: Build and push era-service
        run: |
          docker build -f infrastructure/docker/EraService.Dockerfile \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/era-service:${{ env.IMAGE_TAG }} \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/era-service:latest .
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/era-service:${{ env.IMAGE_TAG }}
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/era-service:latest

      - name: Build and push auth-service
        run: |
          docker build -f infrastructure/docker/AuthService.Dockerfile \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/auth-service:${{ env.IMAGE_TAG }} \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/auth-service:latest .
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/auth-service:${{ env.IMAGE_TAG }}
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/auth-service:latest

      - name: Build and push prescription-service
        run: |
          docker build -f infrastructure/docker/PrescriptionService.Dockerfile \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/prescription-service:${{ env.IMAGE_TAG }} \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/prescription-service:latest .
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/prescription-service:${{ env.IMAGE_TAG }}
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/prescription-service:latest

      - name: Build and push vision-service
        run: |
          docker build -f infrastructure/docker/VisionService.Dockerfile \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/vision-service:${{ env.IMAGE_TAG }} \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/vision-service:latest .
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/vision-service:${{ env.IMAGE_TAG }}
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/vision-service:latest

      # Phase 2 — Deploy Container Apps now that images exist in ACR.
      # Creates apps on first run, updates image tag on subsequent runs.
      - name: Resolve least-privilege Service Bus credentials
        id: servicebus
        shell: bash
        run: |
          namespace=$(az servicebus namespace list \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --query "[?starts_with(name, 'cdo-booking-')].name | [0]" -o tsv)
          test -n "$namespace"
          send_connection=$(az servicebus namespace authorization-rule keys list \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --namespace-name "$namespace" \
            --name booking-intake-send \
            --query primaryConnectionString -o tsv)
          listen_connection=$(az servicebus namespace authorization-rule keys list \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --namespace-name "$namespace" \
            --name booking-scheduling-listen \
            --query primaryConnectionString -o tsv)
          # Topic-scoped listen key for the Portal's coverage intake consumer.
          coverage_intake_listen=$(az servicebus topic authorization-rule keys list \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --namespace-name "$namespace" \
            --topic-name coverage-intake \
            --name portal-listen \
            --query primaryConnectionString -o tsv)
          echo "::add-mask::$send_connection"
          echo "::add-mask::$listen_connection"
          echo "::add-mask::$coverage_intake_listen"
          echo "send_connection=$send_connection" >> "$GITHUB_OUTPUT"
          echo "listen_connection=$listen_connection" >> "$GITHUB_OUTPUT"
          echo "coverage_intake_listen=$coverage_intake_listen" >> "$GITHUB_OUTPUT"

      - name: Deploy Container Apps (Bicep)
        env:
          ZOCDOC_CREDENTIAL_REFERENCE: ${{ vars.ZOCDOC_CREDENTIAL_REFERENCE || 'third-set-smiles-zocdoc' }}
          ZOCDOC_WEBHOOK_INTEGRATION_ID: ${{ secrets.ZOCDOC_WEBHOOK_INTEGRATION_ID }}
          ZOCDOC_WEBHOOK_SECRET: ${{ secrets.ZOCDOC_WEBHOOK_SECRET }}
          ZOCDOC_CLIENT_ID: ${{ secrets.ZOCDOC_CLIENT_ID }}
          ZOCDOC_CLIENT_SECRET: ${{ secrets.ZOCDOC_CLIENT_SECRET }}
          INTEGRATION_INBOX_ADMIN_API_KEY: ${{ secrets.INTEGRATION_INBOX_ADMIN_API_KEY }}
        run: |
          az deployment group create \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --template-file infrastructure/azure/apps.bicep \
            --mode Incremental \
            --parameters \
              acrLoginServer=${{ secrets.ACR_LOGIN_SERVER }} \
              identityId=${{ steps.infra.outputs.identity_id }} \
              environmentId=${{ steps.infra.outputs.environment_id }} \
              imageTag=${{ env.IMAGE_TAG }} \
              postgresHost=${{ secrets.POSTGRES_HOST }} \
              postgresAdminPassword=${{ secrets.POSTGRES_ADMIN_PASSWORD }} \
              jwtKey=${{ secrets.JWT_KEY }} \
              serviceBusSendConnection='${{ steps.servicebus.outputs.send_connection }}' \
              serviceBusListenConnection='${{ steps.servicebus.outputs.listen_connection }}' \
              coverageVerificationEnabled=${{ vars.COVERAGE_VERIFICATION_ENABLED == 'true' }} \
              coverageIntakeEnabled=${{ vars.COVERAGE_INTAKE_ENABLED == 'true' }} \
              emailSmtpHost='${{ vars.EMAIL_SMTP_HOST }}' \
              emailSmtpPort=${{ vars.EMAIL_SMTP_PORT || '587' }} \
              emailSmtpUsername='${{ vars.EMAIL_SMTP_USERNAME }}' \
              emailSmtpPassword='${{ secrets.EMAIL_SMTP_PASSWORD }}' \
              emailFromAddress='${{ vars.EMAIL_FROM_ADDRESS }}' \
              practiceReplyTo='${{ vars.PRACTICE_REPLY_TO }}' \
              coverageIntakeSigningKey='${{ secrets.COVERAGE_INTAKE_SIGNING_KEY }}' \
              coverageIntakeLinkBaseUrl='${{ vars.COVERAGE_INTAKE_LINK_BASE_URL }}' \
              coverageIntakeListenConnection='${{ steps.servicebus.outputs.coverage_intake_listen }}' \
              publicBookingApiKey='${{ secrets.PUBLIC_BOOKING_API_KEY }}' \
              patientServiceApiKey='${{ secrets.PATIENT_SERVICE_API_KEY }}' \
              publicSchedulingServiceApiKey='${{ secrets.PUBLIC_SCHEDULING_SERVICE_API_KEY }}' \
              publicAvailabilitySlotKey='${{ secrets.PUBLIC_AVAILABILITY_SLOT_KEY }}' \
              zocdocCredentialReference="$ZOCDOC_CREDENTIAL_REFERENCE" \
              zocdocWebhookIntegrationId="$ZOCDOC_WEBHOOK_INTEGRATION_ID" \
              zocdocWebhookSecret="$ZOCDOC_WEBHOOK_SECRET" \
              zocdocClientId="$ZOCDOC_CLIENT_ID" \
              zocdocClientSecret="$ZOCDOC_CLIENT_SECRET" \
              integrationInboxAdminApiKey="$INTEGRATION_INBOX_ADMIN_API_KEY" \
              googleOAuthClientId='${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}' \
              googleOAuthClientSecret='${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}' \
              searchConsoleServiceAccountEmail='${{ secrets.SEARCH_CONSOLE_SERVICE_ACCOUNT_EMAIL }}' \
              searchConsolePrivateKey='${{ secrets.SEARCH_CONSOLE_PRIVATE_KEY }}' \
              cloudHealthOfficeApiKey='${{ secrets.CHO_ESTIMATE_API_KEY }}' \
              cloudHealthOfficeEligibilityBaseUrl='${{ vars.CHO_ELIGIBILITY_BASE_URL }}' \
              cloudHealthOfficeEligibilityApiKey='${{ secrets.CHO_ELIGIBILITY_API_KEY }}' \
              cloudHealthOfficeEligibilityPayerIds='${{ vars.CHO_ELIGIBILITY_PAYER_IDS || '[]' }}' \
              keyVaultUri='${{ steps.infra.outputs.key_vault_uri }}' \
              portalIdentityId='${{ steps.infra.outputs.portal_identity_id }}' \
              portalIdentityClientId='${{ steps.infra.outputs.portal_identity_client_id }}' \
              stediSharedAccountEnabled=${{ vars.STEDI_SHARED_ACCOUNT_ENABLED == 'true' }} \
              stediSharedAccountSecretName='${{ vars.STEDI_SHARED_ACCOUNT_SECRET_NAME }}' \
              clearinghouseEligibilityPayerIds='${{ vars.CLEARINGHOUSE_ELIGIBILITY_PAYER_IDS || '[]' }}' \
              clearinghouseEligibilityDefault=${{ vars.CLEARINGHOUSE_ELIGIBILITY_DEFAULT == 'true' }}

      # DNS is hosted in Cloudflare. The CNAME and asuid TXT records must exist
      # before this step runs. Keeping hostname/certificate binding here makes
      # the operation repeatable without introducing a Bicep dependency cycle
      # between the Container App hostname and its managed certificate.
      - name: Bind production custom domains
        shell: bash
        run: |
          set -euo pipefail

          environment_name="$(basename '${{ steps.infra.outputs.environment_id }}')"

          bind_domain() {
            local app_name="$1"
            local hostname="$2"

            if ! az containerapp hostname list \
              --name "$app_name" \
              --resource-group "${{ env.RESOURCE_GROUP }}" \
              --query "[?name=='$hostname'] | [0].name" \
              --output tsv | grep -Fxq "$hostname"; then
              az containerapp hostname add \
                --name "$app_name" \
                --resource-group "${{ env.RESOURCE_GROUP }}" \
                --hostname "$hostname" \
                --only-show-errors \
                --output none
            fi

            az containerapp hostname bind \
              --name "$app_name" \
              --resource-group "${{ env.RESOURCE_GROUP }}" \
              --environment "$environment_name" \
              --hostname "$hostname" \
              --validation-method CNAME \
              --only-show-errors \
              --output none
          }

          bind_domain portal portal.3rdsetsmiles.com
          bind_domain intake-service book-api.3rdsetsmiles.com

      # ── Verify deployment ─────────────────────────────────────────────────────

      - name: Verify portal is running
        run: |
          az containerapp show \
            --name portal \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "properties.latestRevisionFqdn" \
            --output tsv

      - name: Verify IntakeService is healthy
        shell: bash
        run: |
          fqdn=$(az containerapp show \
            --name intake-service \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --query properties.configuration.ingress.fqdn -o tsv)
          test -n "$fqdn"
          curl --fail --retry 5 --retry-delay 5 "https://$fqdn/health"
          echo "IntakeService: https://$fqdn"

      - name: Verify production custom domains
        shell: bash
        run: |
          portal_redirect=$(curl --silent --show-error --retry 12 --retry-delay 10 \
            --output /dev/null --write-out '%{redirect_url}' \
            'https://portal.3rdsetsmiles.com/.auth/login/google?post_login_redirect_uri=%2F')
          case "$portal_redirect" in
            https://accounts.google.com/*) ;;
            *) echo "Portal did not redirect to Google authentication" >&2; exit 1 ;;
          esac
          curl --fail --retry 12 --retry-delay 10 \
            https://book-api.3rdsetsmiles.com/health
